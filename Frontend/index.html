<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema MDCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* — cores — */
      --color-bg: #ffffff;
      --color-neutral-100: #f5f4f2;
      --color-neutral-200: #efeeeb;
      --color-neutral-300: #e2e0dc;
      --color-neutral-600: #6b6864;
      --color-neutral-700: #524f4b;
      --color-neutral-800: #3a3835;
      --color-neutral-900: #201f1d;
      --color-text: var(--color-neutral-900);
      --color-divider: #e4e2de;

      --color-accent: #f02d34;
      --color-accent-100: #fdeaea;
      --color-accent-600: #d2262c;
      --color-accent-700: #b31f24;
      --color-accent-800: #8c171b;

      /* — tipografia — */
      --font-heading: "Bitter", Georgia, "Times New Roman", serif;
      --font-body: "Archivo", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      /* — espaçamento — */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 40px;

      /* — bordas e raios — */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;

      --sidebar-width: 246px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
    }

    a { color: var(--color-accent-700); }
    a:hover { color: var(--color-accent-800); }

    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* — sidebar — */
    .sidebar {
      width: var(--sidebar-width);
      flex: none;
      background: var(--color-neutral-100);
      border-right: 1px solid var(--color-divider);
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      display: block;
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--color-divider);
      text-decoration: none;
      color: inherit;
    }

    .sidebar-logo svg { display: block; }

    .sidebar-logo-caption {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent-700);
    }

    .sidebar-nav {
      flex: 1;
      padding: 8px 0 20px;
    }

    .nav-group-title {
      padding: 16px 20px 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-neutral-600);
    }

    .nav-item {
      display: block;
      padding: 10px 20px;
      margin: 2px 10px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      text-decoration: none;
    }

    .nav-item:not(.is-disabled):hover {
      background: var(--color-accent-100);
      color: var(--color-accent-800);
    }

    .nav-item.is-disabled {
      color: var(--color-neutral-600);
      cursor: default;
    }

    .nav-item-badge,
    .module-card-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--color-neutral-200);
      color: var(--color-neutral-600);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-item-badge {
      margin-left: 8px;
      vertical-align: middle;
    }

    /* — botão de menu mobile — */
    .mobile-nav-toggle {
      display: none;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: var(--color-neutral-100);
      border: none;
      border-bottom: 1px solid var(--color-divider);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      text-align: left;
    }

    /* — área principal — */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .main-header {
      padding: 22px 30px;
      border-bottom: 1px solid var(--color-divider);
    }

    .breadcrumb {
      font-size: 11px;
      color: var(--color-neutral-600);
    }

    .page-title {
      margin: 4px 0 0;
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 28px;
      line-height: 1.2;
      color: var(--color-text);
    }

    .main-content {
      flex: 1;
      padding: 34px 30px 48px;
      max-width: 760px;
    }

    .lede {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--color-neutral-700);
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .module-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 22px 20px;
      background: var(--color-bg);
      border: 1px solid var(--color-divider);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: var(--color-text);
    }

    .module-card:not(.is-disabled):hover {
      border-color: var(--color-accent);
    }

    .module-card:not(.is-disabled):focus-visible {
      border-color: var(--color-accent);
    }

    .module-card.is-disabled {
      cursor: default;
    }

    .module-card-label {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: 18px;
      color: var(--color-text);
    }

    .module-card.is-disabled .module-card-label {
      color: var(--color-neutral-600);
    }

    .module-card-arrow {
      flex: none;
      font-size: 16px;
      color: var(--color-accent-700);
    }

    .module-card-badge {
      flex: none;
    }

    /* — mobile — */
    @media (max-width: 780px) {
      .app {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-divider);
        display: none;
      }

      .sidebar.is-open {
        display: flex;
      }

      .mobile-nav-toggle {
        display: flex;
      }

      .main-header {
        padding: 18px 20px;
      }

      .main-content {
        padding: 24px 20px 40px;
        max-width: 100%;
      }

      .module-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      var sidebar = document.getElementById('sidebar');
      toggle.addEventListener('click', function () {
        var isOpen = sidebar.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(isOpen));
      });
    })();
