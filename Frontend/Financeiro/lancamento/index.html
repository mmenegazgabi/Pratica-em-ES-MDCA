<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Minhas despesas · MDCA</title>
  <link rel="stylesheet" href="../base/tokens.css">
  <link rel="stylesheet" href="../base/componentes.css">
  <link rel="stylesheet" href="./lancamento.css">
</head>
<body>
  <main id="tela" class="tela" aria-live="polite">
    <p class="carregando" role="status">Carregando…</p>
  </main>

  <nav id="abas" class="abas" aria-label="Seções" hidden>
    <a class="abas__item" href="#/" data-aba="despesas"><span data-icone="lancamentos"></span>Despesas</a>
    <a class="abas__item" href="#/avisos" data-aba="avisos"><span data-icone="sino"></span>Avisos</a>
    <a class="abas__item" href="#/perfil" data-aba="perfil"><span data-icone="perfil"></span>Perfil</a>
  </nav>

  <div id="aviso-flutuante" class="aviso-flutuante" role="status" hidden></div>

  <!-- capture abre direto a câmera traseira; o outro abre galeria/arquivos -->
  <input id="campo-camera" class="arquivo-oculto" type="file" accept="image/*,application/pdf" capture="environment" tabindex="-1" aria-hidden="true">
  <input id="campo-galeria" class="arquivo-oculto" type="file" accept="image/*,application/pdf" tabindex="-1" aria-hidden="true">

  <script type="module" src="./lancamento.js"></script>
</body>
</html>
