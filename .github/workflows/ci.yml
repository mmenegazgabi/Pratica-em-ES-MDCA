name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-infra:
    name: Backend · Infraestrutura integrada
    runs-on: ubuntu-latest
    # Disposable Postgres for the migration tests in Backend/Shared/tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mdca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/requirements-dev.txt
      - run: pytest Backend

  backend-financeiro:
    name: Backend · Financeiro
    runs-on: ubuntu-latest
    # Disposable Postgres for the Financeiro persistence tests (test_persistencia_banco.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mdca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/Financeiro/requirements.txt
      - run: pytest Backend/Financeiro

  backend-gestao:
    name: Backend · Gestão
    runs-on: ubuntu-latest
    # Disposable Postgres for the Gestao tests that read from the database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mdca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mdca_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/Gestao/requirements.txt
      - run: pytest Backend/Gestao

  deploy-backend:
    name: Backend · Deploy no Cloud Run
    needs: [backend-infra, backend-financeiro, backend-gestao]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mmenegazgabi/Pratica-em-ES-MDCA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloud-run-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ignorar execução de um commit antigo
        id: latest-main
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-main-head.sh
      # O banco de produção só muda por aqui: a migration roda antes do código novo
      # subir, e se ela falhar o deploy para. Ninguém aplica migration à mão.
      - uses: actions/setup-python@v5
        if: steps.latest-main.outputs.current == 'true'
        with:
          python-version: "3.12"
      - name: Aplicar migrations no banco de produção
        if: steps.latest-main.outputs.current == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL não configurado: o deploy não sobe sem as migrations."
            exit 1
          fi
          pip install -r Backend/requirements.txt
          cd Backend
          echo "Antes:"; alembic -c Shared/alembic.ini current
          alembic -c Shared/alembic.ini upgrade head
          echo "Depois:"; alembic -c Shared/alembic.ini current
      - name: Autenticar no Google Cloud sem chave permanente
        if: steps.latest-main.outputs.current == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: pratica-em-es-mdca
          workload_identity_provider: projects/547285598829/locations/global/workloadIdentityPools/mdca-github/providers/github-main
          service_account: mdca-github-deploy@pratica-em-es-mdca.iam.gserviceaccount.com
      - name: Publicar Backend usando o Dockerfile
        id: deploy
        if: steps.latest-main.outputs.current == 'true'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          project_id: pratica-em-es-mdca
          service: pratica-em-es-mdca
          region: southamerica-east1
          source: Backend
          flags: --clear-base-image
      - name: Verificar API publicada
        if: steps.deploy.outcome == 'success'
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.url }}
        run: python3 scripts/verify-backend.py "$BACKEND_URL"
