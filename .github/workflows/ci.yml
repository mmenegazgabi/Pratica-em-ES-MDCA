name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-financeiro:
    name: Backend · Financeiro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/financeiro/requirements.txt
      - run: pytest backend/financeiro

  backend-gestao:
    name: Backend · Gestão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/gestao/requirements.txt
      - run: pytest backend/gestao
