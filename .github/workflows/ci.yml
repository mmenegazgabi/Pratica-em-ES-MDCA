name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-infra:
    name: Backend · Infraestrutura integrada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/requirements-dev.txt
      - run: pytest Backend

  backend-financeiro:
    name: Backend · Financeiro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/Financeiro/requirements.txt
      - run: pytest Backend/Financeiro

  backend-gestao:
    name: Backend · Gestão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r Backend/Gestao/requirements.txt
      - run: pytest Backend/Gestao
